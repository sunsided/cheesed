[package]
name = "cheese"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Cheesed! A thrilling action adventure in DOS-era dress. The Mouse. The Cheese. The Destiny."
license = "EUPL-1.2"
authors = ["Markus Mayer"]
publish = false

[dependencies]
game-toolkit = { version = "0.7", features = ["synth"] }
log = "0.4"

# Native builds log via env_logger; on the web the toolkit logs to the browser console.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
dirs = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Location",
    "Document",
    "Element",
    "EventTarget",
    "Event",
    "CustomEvent",
    "CustomEventInit",
    "MessageEvent",
    "Navigator",
    "AudioContext",
    "AudioContextState",
] }

# Optimize dependencies even in dev builds; our own code still compiles fast.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The solver test walks millions of states; unoptimized it takes minutes.
[profile.test]
opt-level = 2

# Spin on the local game-toolkit until 0.7.1 (synthie music) is on crates.io; synthie 0.7.1
# already is. Feature branch only: these paths don't exist on CI. Remove this section once
# game-toolkit 0.7.1 is published.
[patch.crates-io]
game-toolkit = { path = "../game-toolkit/crates/prelude" }
game-toolkit-audio = { path = "../game-toolkit/crates/audio" }
game-toolkit-core = { path = "../game-toolkit/crates/core" }
game-toolkit-gfx = { path = "../game-toolkit/crates/gfx" }
game-toolkit-input = { path = "../game-toolkit/crates/input" }
game-toolkit-assets = { path = "../game-toolkit/crates/assets" }

